<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IIT Veterinaria</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Inicio de sesión -->
  <section id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="login-brand"><span class="logo">🐾</span><strong>IIT Veterinaria</strong><small>Software de gestión veterinaria</small></div>
      <label>Usuario<input name="usuario" autocomplete="username" required /></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required /></label>
      <div id="login-error" class="errors"></div>
      <button class="btn primary" type="submit">Iniciar sesión</button>
      <a class="link-reserva" href="reservar.html">¿Eres cliente? Reserva tu cita en línea →</a>
    </form>
  </section>

  <div id="shell" class="hidden">
    <aside class="sidebar no-print" id="sidebar">
      <div class="brand">
        <span class="logo">🐾</span>
        <div><strong id="brand-name">IIT Veterinaria</strong><small>Cuidado animal</small></div>
      </div>
      <nav id="menu"></nav>
    </aside>

    <div class="main">
      <header class="topbar no-print">
        <button class="hamburger" id="toggle" aria-label="Menú">☰</button>
        <h1 id="title">Inicio</h1>
        <div class="user-box">
          <span id="user-name"></span>
          <button class="btn sm ghost" id="btn-password" title="Cambiar contraseña">🔑</button>
          <button class="btn sm ghost" id="btn-logout">Salir</button>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <dialog id="modal">
    <form id="form" method="dialog">
      <h2 id="form-title"></h2>
      <div id="form-errors" class="errors"></div>
      <div id="form-fields" class="grid"></div>
      <div class="actions">
        <button type="button" class="btn ghost" id="cancel">Cancelar</button>
        <button type="submit" class="btn primary" id="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
